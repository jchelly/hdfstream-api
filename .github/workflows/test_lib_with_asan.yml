name: Test C API

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake pkg-config libhdf5-dev libmsgpack-dev

    - name: Create build directory
      run: mkdir build

    - name: Configure
      run: cmake .. -DCMAKE_BUILD_TYPE=Release
      working-directory: build

    - name: Build
      run: make
      working-directory: build

    - name: Run tests with CTest
      run: ctest --output-on-failure
      working-directory: build
