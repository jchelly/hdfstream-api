version: 2
updates:
  # Check Java dependencies of the server code
  - package-ecosystem: "maven"
    directory: "/webapp"
    ignore:
      - dependency-name: "uk.ac.dur.cosma:libhdfstream"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "java"

  # GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "ci"
